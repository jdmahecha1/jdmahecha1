# Cada día regenera las tarjetas de estadísticas y la culebrita de contribuciones,
# y las publica en la rama "output" (el README las enlaza desde allí).
name: Estadísticas del perfil

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/estadisticas.yml']

permissions:
  contents: write

concurrency:
  group: estadisticas
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Tarjetas de lenguajes y actividad
        run: node scripts/estadisticas.mjs "${{ github.repository_owner }}" salida
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Culebrita de contribuciones
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            salida/culebrita-oscura.svg?palette=github-dark&color_snake=#3ecf8e
            salida/culebrita-clara.svg?palette=github-light&color_snake=#1e3a8a

      - name: Publicar en la rama output
        run: |
          cd salida
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Actualiza estadísticas"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
